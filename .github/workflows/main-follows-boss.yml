name: main-follows-boss
# A cloud session can only push its own branch. When a boss works from the cloud it pushes
# its own boss branch (<username>/boss, for any of the four accounts), and this moves main forward to the same commit. It never creates a commit
# (fast-forward only), so every commit on main is still authored and committed by a person.
on:
  push:
    branches: ["cstljuan/boss", "cstljuan/director", "Rickstar-App/boss", "nexodv/boss", "Peypey-ryd/boss"]
permissions:
  contents: write
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is authored and committed by a team account
        run: sh tools/check-authors.sh HEAD
      - name: Move main forward to the boss branch (fast-forward only)
        run: git push origin HEAD:refs/heads/main
