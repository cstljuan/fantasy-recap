<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0e">
<title>Soccer, Fantasy Recap</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <header class="bar">
    <a class="brand" href="#matchup"><i class="lamp"></i>Soccer</a>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#matchup" data-tab="matchup">Matchup</a>
      <a href="#lineups" data-tab="lineups">Lineups</a>
      <a href="#plays" data-tab="plays">Plays</a>
      <a href="#recap" data-tab="recap">Recap</a>
    </nav>
    <span class="mock">Sample match</span>
  </header>

  <main>
    <section class="screen" id="s-matchup" aria-label="Matchup"></section>
    <section class="screen" id="s-lineups" aria-label="Lineups" hidden></section>
    <section class="screen" id="s-plays" aria-label="Play by play" hidden></section>
    <section class="screen" id="s-recap" aria-label="Recap" hidden></section>
  </main>

  <footer class="note">Sample league. Real player names. The match, stats and scores are made up for the demo.</footer>
</div>

<div id="gameView" hidden>
  <div class="stage">
    <canvas id="scGame" aria-label="The match, seen from above. A sample match."></canvas>
    <button type="button" id="closeGame" class="close" hidden>Close</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/fantasy.js"></script>
<script src="data/current.js"></script>
<script>
  // Play the match the match maker built (soccer/data/current.js). ?game=sample plays the built-in sample.
  if (window.SC_GAME_FILE && !/[?&]game=sample/.test(location.search)) { SC_DATA.TEAMS = SC_GAME_FILE.teams; SC_DATA.SAMPLE_GAME = SC_GAME_FILE.game; }
</script>
<script src="js/rules.js"></script>
<script src="js/plays.js"></script>
<script src="js/sprites.js"></script>
<script src="js/font.js"></script>
<script src="js/stadium.js"></script>
<script src="../js/announcer/soccer/lines.js"></script>
<script src="../js/announcer/soccer/index.js"></script>
<script src="../assets/voice/soccer/index.js"></script>
<script src="../js/announcer/voice/play.js"></script>
<script src="../js/audio.js"></script>
<script src="js/main.js"></script>
<script src="js/app.js"></script>
<script src="../js/screens/extras.js"></script>
<script src="../js/screens/i18n.js"></script>
<script>
  // C32: the jump bar, rule cards and share card from js/screens/extras.js, and the screens'
  // Spanish from js/screens/i18n.js (labels only; the announcer stays English).
  (function () {
    // The app around this page switches the language: follow it.
    window.addEventListener('storage', function (e) {
      if (e.key === 'fr.lang' && window.FR_I18N) window.FR_I18N.setLang(e.newValue === 'es' ? 'es' : 'en');
    });
    var G = window.SC_GAME, A = window.SC_ANNOUNCER, stage = document.querySelector('.stage'), close = document.getElementById('closeGame');
    if (!window.FR_EXTRAS || !G || !stage || !close) return;
    function masked() { return !!(window.__app && window.__app.masked); }
    var x = window.FR_EXTRAS.attach({
      game: G, announcer: A, stage: stage,
      isOpen: function () { return !!G.active; },
      isMasked: masked,
      speed: function () { return window.__sc ? window.__sc.speed : 1; }
    });
    // The best goal of the match, for the share card: the one worth the most fantasy points.
    var best = null;
    G.on(function (type, d) {
      if (type === 'reset') best = null;
      var r = d && d.res;
      if (type !== 'result' || !r || !r.goal || r.disallowed) return;
      var pts = (r.fp || []).reduce(function (n, f) { return n + Math.abs(f.pts || 0); }, 0);
      if (!best || pts > best.points) {
        var T = SC_DATA.TEAMS[r.team], names = (r.fp || []).map(function (f) { return (SC_DATA.TEAMS[f.team].roster || {})[f.role]; }).filter(Boolean);
        best = { text: String(r.text || '').replace(/^\d+' /, ''), players: names.filter(function (n, i) { return names.indexOf(n) === i; }), points: pts, label: 'Top goal, ' + r.min + "'", team: T };
      }
    });
    var share = document.createElement('button');
    share.type = 'button'; share.className = 'frx-learn frx-share'; share.textContent = 'Share result'; share.hidden = true;
    share.style.cssText = 'position:absolute;left:auto;right:8px;top:214px;z-index:3';   // under Learn the game
    stage.appendChild(share);
    share.addEventListener('click', function () {
      var T = SC_DATA.TEAMS, tot = window.__app && window.__app.totals ? window.__app.totals() : ['', ''];
      window.FR_EXTRAS.shareCard({
        title: 'Fantasy Recap', week: 'Week 11',
        teams: T.map(function (t) { return { name: t.full || t.name, color: t.colors.shirt }; }), score: tot,
        play: best ? { text: best.text, players: best.players, points: best.points, label: best.label } : null,
        footer: 'Sample match. Real names, made-up stats.', fileName: 'fantasy-recap-soccer.png'
      });
    });
    // The jump bar and Learn the game show where the Close button shows (js/app.js reveals it on a tap).
    // The share button shows on the full time board (a tap there opens the recap).
    function sync() {
      x.setVisible(!close.hidden);
      share.hidden = !G.active || G.mode !== 'final' || masked();
    }
    new MutationObserver(sync).observe(close, { attributes: true, attributeFilter: ['hidden'] });
    G.on(function () { setTimeout(sync, 0); });
    new MutationObserver(sync).observe(document.getElementById('gameView'), { attributes: true, attributeFilter: ['hidden'] });
    sync();
  })();
</script>
</body>
</html>
