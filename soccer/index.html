<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d0e">
<title>Soccer, sample match</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d0e; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; image-rendering: pixelated; touch-action: none; }
</style>
</head>
<body>
<canvas id="scGame" aria-label="Soccer match seen from above. Sample match with mock data."></canvas>

<script src="js/data.js"></script>
<script src="js/fantasy.js"></script>
<script src="data/current.js"></script>
<script>
  // Play the match the match maker built (soccer/data/current.js). ?game=sample plays the built-in sample.
  if (window.SC_GAME_FILE && !/[?&]game=sample/.test(location.search)) { SC_DATA.TEAMS = SC_GAME_FILE.teams; SC_DATA.SAMPLE_GAME = SC_GAME_FILE.game; }
</script>
<script src="js/rules.js"></script>
<script src="js/plays.js"></script>
<script src="js/sprites.js"></script>
<script src="js/font.js"></script>
<script src="js/stadium.js"></script>
<script src="js/main.js"></script>
<script>
  // Runs the soccer game on its own. Tap at full time to watch it again.
  SC_GAME.setActive(true);
  SC_GAME.start();
  SC_GAME.ontap = function (mode) { if (mode === 'final') SC_GAME.restart(); };
</script>
</body>
</html>
