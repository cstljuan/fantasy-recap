# The plays service (server/) on Render, for the hosted app. One web service, free plan.
# DATABASE_URL is asked for when the service is created and is never in this repository.
services:
  - type: web
    name: fantasy-recap
    runtime: node
    plan: free
    buildCommand: cd server && npm install --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://cstljuan.github.io
      - key: NODE_VERSION
        value: "22"
