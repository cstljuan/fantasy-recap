name: FantasyRecap
options:
  bundleIdPrefix: club.fantasyrecap
  deploymentTarget:
    iOS: "17.0"
targets:
  FantasyRecap:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: club.fantasyrecap.fantasyrecap
        PRODUCT_NAME: FantasyRecap
        DEVELOPMENT_TEAM: ""   # put your own Apple team id here
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Fantasy Recap"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
