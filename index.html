<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d0e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="js/screens/icons/apple-touch-icon.png">
<title>Fantasy Recap</title>
<link rel="stylesheet" href="css/app.css">
<style>
#soccerView { position: relative; height: calc(100vh - 120px); height: calc(100dvh - 120px); min-height: 420px; }
#soccerView iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #0b0d0e; }
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <a class="brand" href="#matchup"><i class="lamp"></i>Match Viewer</a>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#matchup" data-tab="matchup">Matchup</a>
      <a href="#lineups" data-tab="lineups">Lineups</a>
      <a href="#plays" data-tab="plays">Plays</a>
      <a href="#recap" data-tab="recap">Recap</a>
    </nav>
    <span class="mock">Sample games</span>
  </header>

  <main>
    <section class="screen" id="s-matchup" aria-label="Matchup"></section>
    <section class="screen" id="s-lineups" aria-label="Lineups" hidden></section>
    <section class="screen" id="s-plays" aria-label="Play by play" hidden></section>
    <section class="screen" id="s-recap" aria-label="Recap" hidden></section>
  </main>

  <div id="soccerView" hidden></div>

  <footer class="note">Sample league. Real player names. The games, stats and scores are made up for the demo.</footer>
</div>

<div id="gameView" hidden>
  <div class="stage">
    <canvas id="game" aria-label="The game, seen from above. A sample game."></canvas>
    <button type="button" id="closeGame" class="close" hidden>Close</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="data/games/current.js"></script>
<script>
// Play the game file the boss selected (tools/use-game.js). ?game=sample plays the built-in sample.
if (window.FF_GAME_FILE && !window.FF_USE_SAMPLE && !/[?&]game=sample/.test(location.search)) { FF_DATA.TEAMS = FF_GAME_FILE.teams; FF_DATA.SAMPLE_GAME = FF_GAME_FILE.game; }
</script>
<script src="js/rules.js"></script>
<script src="js/plays.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/announcer/lines.js"></script>
<script src="js/announcer/index.js"></script>
<script src="js/announcer/voice/play.js"></script>
<script src="js/main.js"></script>
<script src="js/sport.js"></script>
<script src="js/app.js"></script>
</body>
</html>
