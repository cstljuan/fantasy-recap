<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d0e">
<title>Fantasy Recap</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">
  <header class="bar">
    <a class="brand" href="#matchup"><i class="lamp"></i>Match Viewer</a>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#matchup" data-tab="matchup">Matchup</a>
      <a href="#lineups" data-tab="lineups">Lineups</a>
      <a href="#plays" data-tab="plays">Plays</a>
      <a href="#recap" data-tab="recap">Recap</a>
    </nav>
    <span class="mock">Mock data</span>
  </header>

  <main>
    <section class="screen" id="s-matchup" aria-label="Matchup"></section>
    <section class="screen" id="s-lineups" aria-label="Lineups" hidden></section>
    <section class="screen" id="s-plays" aria-label="Play by play" hidden></section>
    <section class="screen" id="s-recap" aria-label="Recap" hidden></section>
  </main>

  <footer class="note">Sample league. Every team, player, score and play in this app is made up for the demo.</footer>
</div>

<div id="gameView" hidden>
  <div class="stage">
    <canvas id="game" aria-label="The game, seen from above. Sample game with mock data."></canvas>
    <button type="button" id="closeGame" class="close" hidden>Close</button>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/rules.js"></script>
<script src="js/plays.js"></script>
<script src="js/sprites.js"></script>
<script src="js/audio.js"></script>
<script src="js/announcer/lines.js"></script>
<script src="js/announcer/index.js"></script>
<script src="js/main.js"></script>
<script src="js/app.js"></script>
</body>
</html>
